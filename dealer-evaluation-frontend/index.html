<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Evaluation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; padding-top: 50px; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h2 class="mb-0">Dealer Evaluation Dashboard</h2>
                </div>
                <div class="card-body p-4">
                    <div class="mb-4">
                        <label for="productSelect" class="form-label fw-bold">Select a Product:</label>
                        <select id="productSelect" class="form-select" onchange="fetchDealers()">
                            <option value="">-- Choose a product --</option>
                        </select>
                    </div>

                    <div id="dealersSection" class="mb-4" style="display:none;">
                        <h4 class="mb-3">Dealers:</h4>
                        <div id="dealersList"></div>
                    </div>

                    <div id="resultsSection" class="mt-4" style="display:none;">
                        <h4 class="mb-3">Pricing Results:</h4>
                        <div id="resultsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // REEMPLAZA ESTAS URLS CON TUS URLS REALES DE CODE ENGINE
    const PRODUCT_API_URL = "https://product-details-python.xxxxxx.us-south.codeengine.appdomain.cloud";
    const PRICING_API_URL = "https://dealer-pricing-nodejs.xxxxxx.us-south.codeengine.appdomain.cloud";

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const response = await fetch(`${PRODUCT_API_URL}/products`);
            const products = await response.json();
            const select = document.getElementById("productSelect");
            products.forEach(p => {
                const option = document.createElement("option");
                option.value = p.id;
                option.textContent = p.name;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("Error fetching products:", error);
        }
    });

    async function fetchDealers() {
        const productId = document.getElementById("productSelect").value;
        const dealersList = document.getElementById("dealersList");
        const dealersSection = document.getElementById("dealersSection");
        const resultsSection = document.getElementById("resultsSection");

        dealersList.innerHTML = "";
        document.getElementById("resultsList").innerHTML = "";
        
        if (!productId) {
            dealersSection.style.display = "none";
            resultsSection.style.display = "none";
            return;
        }

        try {
            const response = await fetch(`${PRICING_API_URL}/dealers/${productId}`);
            const dealers = await response.json();
            
            if (dealers.length > 0) {
                dealersSection.style.display = "block";
                dealers.forEach(d => {
                    const div = document.createElement("div");
                    div.className = "form-check";
                    div.innerHTML = `
                        <input class="form-check-input" type="checkbox" value="${d.id}" id="dealer_${d.id}" onchange="fetchPrice('${productId}', '${d.id}', '${d.name}')">
                        <label class="form-check-label" for="dealer_${d.id}">
                            ${d.name}
                        </label>
                        <div id="price_${d.id}" class="text-success fw-bold mt-1 mb-2" style="display:none;"></div>
                    `;
                    dealersList.appendChild(div);
                });
            } else {
                dealersList.innerHTML = "<p class='text-muted'>No dealers found for this product.</p>";
                dealersSection.style.display = "block";
            }
        } catch (error) {
            console.error("Error fetching dealers:", error);
        }
    }

    async function fetchPrice(productId, dealerId, dealerName) {
        const checkbox = document.getElementById(`dealer_${dealerId}`);
        const priceDiv = document.getElementById(`price_${dealerId}`);
        const resultsSection = document.getElementById("resultsSection");
        const resultsList = document.getElementById("resultsList");

        if (checkbox.checked) {
            try {
                const response = await fetch(`${PRICING_API_URL}/price/${productId}/${dealerId}`);
                const data = await response.json();
                if (data.price) {
                    priceDiv.textContent = `Price: $${data.price}`;
                    priceDiv.style.display = "block";
                    
                    // Agregar al resumen
                    resultsSection.style.display = "block";
                    const resultItem = document.createElement("div");
                    resultItem.id = `result_${dealerId}`;
                    resultItem.className = "alert alert-info py-2 mb-2";
                    resultItem.innerHTML = `<strong>${dealerName}:</strong> $${data.price}`;
                    resultsList.appendChild(resultItem);
                }
            } catch (error) {
                console.error("Error fetching price:", error);
            }
        } else {
            priceDiv.style.display = "none";
            const resultItem = document.getElementById(`result_${dealerId}`);
            if (resultItem) resultItem.remove();
            if (resultsList.children.length === 0) resultsSection.style.display = "none";
        }
    }
</script>

</body>
</html>
